identity:
  author: Desearch
  name: desearch
  label:
    en_US: Desearch
  description:
    en_US: AI search, X search and web search for AI agents. Bring your own Desearch API key.
  icon: icon.png
  tags:
    - search
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key

      en_US: Create a key at https://console.desearch.ai/api-keys
    url: https://console.desearch.ai/api-keys
tools:
  - tools/web_search.yaml
  - tools/ai_search.yaml
  - tools/x_search.yaml
extra:
  python:
    source: provider/desearch.py
